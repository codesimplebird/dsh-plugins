# 凭据模板：复制为 %USERPROFILE%\.dsh\.credentials.yaml 后填入自己的值。
# ⚠ 仓库（含 git 历史）绝不包含任何真实密钥；.credentials.yaml 已在 .gitignore 中。

# OpenCode Go 订阅密钥（主模型 / 子代理走 OpenCode Go 时用）
OPENCODE_GO_API_KEY: <你的-OpenCode-Go-key>

# OpenCode API key（可选：部分免费档模型 / 旧版用量接口用）
OPENCODE_API_KEY: <你的-OpenCode-key>

# DeepSeek 官方 API key（可选：内置搜索、官方余额等功能用）
DEEPSEEK_API_KEY: <你的-DeepSeek-key>

# 可选：浏览器登录 opencode.ai 后的 auth cookie（少数第三方用量/额度插件需要）
OPENCODE_AUTH_COOKIE: <你的-opencode-auth-cookie>
